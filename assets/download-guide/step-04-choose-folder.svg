<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Browse to the Desktop folder and extract</title>
  <desc id="desc">The Extract All dialog points to a new Desktop folder named Padhai Saathi before pressing Extract.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#252034"/><stop offset="1" stop-color="#15131c"/></linearGradient></defs>
  <rect width="640" height="360" rx="20" fill="url(#bg)"/><rect x="45" y="38" width="550" height="284" rx="15" fill="#25232d" stroke="#62596a"/><path d="M60 38h520a15 15 0 0 1 15 15v28H45V53a15 15 0 0 1 15-15" fill="#302d38"/><text x="68" y="64" fill="#f5edf6" font-family="Segoe UI,Arial" font-size="11" font-weight="600">Extract Compressed (Zipped) Folders</text>
  <text x="78" y="111" fill="#ede5ef" font-family="Segoe UI,Arial" font-size="11" font-weight="600">Select a destination and extract files</text><text x="78" y="135" fill="#bcb2c0" font-family="Segoe UI,Arial" font-size="9">Files will be extracted to this folder:</text>
  <rect x="77" y="147" width="355" height="35" rx="7" fill="#17151d" stroke="#514959"/><text x="91" y="169" fill="#d9cddc" font-family="Segoe UI,Arial" font-size="9">C:\Users\You\Desktop\Padhai Saathi</text>
  <rect x="444" y="147" width="95" height="35" rx="7" fill="#352c3d" stroke="#766482"/><text x="491" y="169" text-anchor="middle" fill="#f5eaf4" font-family="Segoe UI,Arial" font-size="9">Browse…</text>
  <rect x="78" y="203" width="13" height="13" rx="2" fill="#8fe0b7"/><path d="m81 209 3 3 5-6" fill="none" stroke="#15251e" stroke-width="1.7"/><text x="99" y="214" fill="#c7bbc9" font-family="Segoe UI,Arial" font-size="9">Show extracted files when complete</text>
  <path d="M76 238h488" stroke="#514959"/>
  <rect x="425" y="252" width="88" height="38" rx="8" fill="#e982b6"/><text x="469" y="276" text-anchor="middle" fill="#2b1728" font-family="Segoe UI,Arial" font-size="10" font-weight="700">Extract</text>
  <rect x="516" y="252" width="61" height="38" rx="8" fill="#34303b" stroke="#5b5260"/><text x="546" y="276" text-anchor="middle" fill="#ded5e1" font-family="Segoe UI,Arial" font-size="9">Cancel</text>
  <g transform="translate(86 245)"><rect width="294" height="53" rx="9" fill="#1b2925" stroke="#78cba3"/><circle cx="25" cy="26" r="11" fill="#8fe0b7"/><path d="m20 26 4 4 7-8" fill="none" stroke="#14251d" stroke-width="2"/><text x="45" y="22" fill="#dff5e9" font-family="Segoe UI,Arial" font-size="9" font-weight="700">Use the Desktop folder you made</text><text x="45" y="37" fill="#a8c8b7" font-family="Segoe UI,Arial" font-size="8">Browse → select folder → Select Folder → Extract</text></g>
</svg>
