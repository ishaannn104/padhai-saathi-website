name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Android APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        cd android
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Sign APK with Release Keystore
      run: |
        keytool -genkeypair -v -keystore release.keystore -alias padhaisaathi -keyalg RSA -keysize 2048 -validity 10000 -storepass padhai123 -keypass padhai123 -dname "CN=PadhaiSaathi, OU=Education, O=PadhaiSaathi, C=IN"
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
        cp "$APK_PATH" PadhaiSaathi-unsigned.apk
        /usr/local/lib/android/sdk/build-tools/34.0.0/zipalign -v -p 4 PadhaiSaathi-unsigned.apk PadhaiSaathi-aligned.apk || cp PadhaiSaathi-unsigned.apk PadhaiSaathi-aligned.apk
        /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:padhai123 --out PadhaiSaathi.apk PadhaiSaathi-aligned.apk
        ls -lh PadhaiSaathi.apk

    - name: Upload APK to GitHub Release v4.2.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        REL_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/tags/v4.2.0 | jq -r .id)
        if [ "$REL_ID" != "null" ]; then
          OLD_ASSET_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID | jq -r '.assets[] | select(.name=="PadhaiSaathi.apk") | .id')
          if [ -n "$OLD_ASSET_ID" ] && [ "$OLD_ASSET_ID" != "null" ]; then
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/assets/$OLD_ASSET_ID"
          fi
          curl -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
               --data-binary @PadhaiSaathi.apk \
               "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets?name=PadhaiSaathi.apk"
          echo "PadhaiSaathi.apk successfully uploaded to Release v4.2.0!"
        fi
