name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew || gradle wrapper
        ./gradlew assembleRelease --no-daemon

    - name: Sign APK
      run: |
        keytool -genkeypair -v -keystore release.keystore -alias padhaisaathi -keyalg RSA -keysize 2048 -validity 10000 -storepass padhai123 -keypass padhai123 -dname "CN=PadhaiSaathi, OU=Education, O=PadhaiSaathi, C=IN"
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
        zipalign -v -p 4 "$APK_PATH" PadhaiSaathi-aligned.apk || cp "$APK_PATH" PadhaiSaathi-aligned.apk
        apksigner sign --ks release.keystore --ks-pass pass:padhai123 --out PadhaiSaathi.apk PadhaiSaathi-aligned.apk
        ls -lh PadhaiSaathi.apk

    - name: Upload to GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        REL_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/tags/v4.2.0 | jq -r .id)
        if [ "$REL_ID" != "null" ]; then
          curl -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
               --data-binary @PadhaiSaathi.apk \
               "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets?name=PadhaiSaathi.apk"
          echo "APK successfully uploaded to Release v4.2.0!"
        fi
